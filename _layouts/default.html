<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.layout == 'case-study' %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}, {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.summary | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Familjen+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-nav">
    <div class="wrap nav-inner">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav aria-label="Main">
        <a href="{{ '/#work' | relative_url }}">Work</a>
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/#contact' | relative_url }}">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>{{ site.title }}, {{ 'now' | date: "%Y" }}</p>
      <p><a href="mailto:{{ site.email }}">{{ site.email }}</a> <a href="{{ site.linkedin }}">LinkedIn</a></p>
    </div>
  </footer>
</body>
</html>
